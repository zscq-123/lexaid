plugins {
    id 'com.android.application'
}

android {
    namespace 'com.lexaid.mobile'
    compileSdk 36

    defaultConfig {
        applicationId 'com.lexaid.mobile'
        minSdk 28
        targetSdk 36
        versionCode 1
        versionName '1.0.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
