name: LexAid
options:
  deploymentTarget:
    iOS: "16.0"
  developmentLanguage: zh-Hans
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: 1
    TARGETED_DEVICE_FAMILY: "1,2"
targets:
  LexAid:
    type: application
    platform: iOS
    sources: [LexAid]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lexaid.study.mobile
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_FILE: LexAid/Info.plist
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        SUPPORTS_MACCATALYST: NO
  LexAidUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [LexAidUITests]
    dependencies:
      - target: LexAid
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lexaid.study.mobile.uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  LexAid:
    build:
      targets:
        LexAid: all
        LexAidUITests: [test]
    test:
      targets: [LexAidUITests]
