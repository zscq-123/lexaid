server:
  # 默认 8080；如被占用可通过环境变量 SERVER_PORT 覆盖（本机开发使用 8081）
  port: ${SERVER_PORT:8080}

spring:
  config:
    import: "optional:file:${user.home}/.config/lexaid/deepseek.properties"
  servlet:
    multipart:
      max-file-size: 4MB
      max-request-size: 21MB
  application:
    name: lexaid-backend
  autoconfigure:
    # 本项目完全使用 JWT，禁用未使用的内存用户和随机开发密码。
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3308/lexaid?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${SPRING_DATASOURCE_USERNAME:lexaid}
    password: ${SPRING_DATASOURCE_PASSWORD:lexaid-local}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: auto

springdoc:
  api-docs:
    path: /v3/api-docs

app:
  jwt:
    # 仅供本机开发；生产环境必须通过 APP_JWT_SECRET 覆盖
    secret: ${APP_JWT_SECRET:LexAid-Development-Only-Secret-Do-Not-Use-In-Production}
    expire-hours: ${APP_JWT_EXPIRE_HOURS:24}

ai:
  base-url: ${AI_BASE_URL:https://api.deepseek.com}
  deepseek-api-key: ${DEEPSEEK_API_KEY:}
  api-key: ${AI_API_KEY:}
  model: ${AI_MODEL:deepseek-flash}
  max-tokens: ${AI_MAX_TOKENS:1200}
  discussion:
    base-url: ${DISCUSSION_AI_BASE_URL:}
    model: ${DISCUSSION_AI_MODEL:}
    api-key: ${DISCUSSION_AI_API_KEY:}

logging:
  level:
    com.lexaid: info
