name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Test and package backend
        working-directory: backend
        run: mvn --batch-mode verify

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Validate public question dataset
        run: node --test scripts/question-dataset.test.mjs && gzip -t datasets/lexaid-public-questions.sql.gz
      - name: Validate public legislation datasets
        run: python3 scripts/legal-code-dataset.test.py && gzip -t datasets/legal-codes/*.sql.gz
      - name: Validate public case-law datasets
        run: python3 scripts/legal-case-dataset.test.py && gzip -t datasets/legal-cases/*.sql.gz
      - name: Validate legal paper catalogue
        run: python3 scripts/legal-paper-dataset.test.py && gzip -t datasets/legal-papers/lexaid-papers.sql.gz
      - name: Validate Electron entrypoints
        working-directory: electron
        run: npm ci && npm test
